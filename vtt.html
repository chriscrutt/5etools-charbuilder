	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="mobile-web-app-capable" content="yes">

	<title>Tabletop - 5etools</title>

	<link rel="stylesheet" href="css/bootstrap.css">
	<link rel="stylesheet" href="css/fontawesome.css">
	<link rel="stylesheet" href="css/main.css">
	<link rel="stylesheet" href="css/vtt.css">

	<!-- Favicons -->
	<link rel="icon" type="image/svg+xml" href="favicon.svg">
	<link rel="icon" type="image/png" sizes="256x256" href="favicon-256x256.png">
	<link rel="icon" type="image/png" sizes="64x64" href="favicon-64x64.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

	<link rel="manifest" href="manifest.webmanifest">
	<meta name="application-name" content="5etools">
	<meta name="theme-color" content="#006bc4">

<body>

<div class="overlay-noise no-print"></div>

<div class="viewport-wrapper vtt-viewport-wrapper">
	<div class="ve-flex-col" data-cancer-id="cancer-header">
		<header class="ve-mobile-sm__hidden page__header no-print">
			<div class="container ve-flex-v-baseline">
				<h1 class="page__title ve-no-wrap ve-my-0" id="page__title">Tabletop</h1>
				<p class="page__subtitle ve-no-wrap ve-my-0" id="page__subtitle">A self-hosted virtual tabletop.</p>
			</div>
		</header>

		<nav class="container page__nav no-print" id="navigation">
			<ul class="nav nav-pills page__nav-inner" id="navbar"></ul>
		</nav>
	</div>

	<div id="vtt-root" class="vtt-root">
		<div class="ve-flex-vh-center initial-message ve-w-100 ve-h-100">Loading tabletop…</div>
	</div>
</div>

<!--5ETOOLS_SCRIPT_ANCHOR-->

<script type="text/javascript" defer src="js/parser.js"></script>

<script type="text/javascript" defer src="js/hist.js"></script>
